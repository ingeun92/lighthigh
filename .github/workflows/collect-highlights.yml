name: collect-highlights

# 유튜브 공식 채널 하이라이트 수집·자동매칭 (YouTube Data API → Supabase)
# 새벽 경기 → 아침 시청 패턴: 경기 종료 직후 올라오는 하이라이트를 촘촘히(15분) 잡아
# 사용자가 아침에 열었을 때 이미 준비돼 있게 한다. 비경기 시간엔 스크립트 스케줄 가드가
# 즉시 idle 처리하므로 쿼터 안전(채널4×약6 = 24u/run × 96회/일 ≈ 2.3K/10K units).
# 매칭 성공 → highlights / 애매 → highlight_candidates(관리자 검토).
on:
  schedule:
    - cron: "*/15 * * * *" # 매 15분 (UTC 기준, GitHub 부하 시 수 분 지연될 수 있음)
  workflow_dispatch: {} # Actions 탭에서 수동 실행 가능

concurrency:
  group: collect-highlights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # 버전은 package.json packageManager(pnpm@10.x) 에서 자동 감지

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: collect highlights
        run: node scripts/collect-highlights.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
