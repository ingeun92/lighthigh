name: sync-matches

# 경기 일정·점수 동기화 (football-data.org → Supabase)
# 라이브 점수가 너무 outdated 되지 않게 5분 주기로 동기화. 실행당 API 1 call이라
# 무료 한도(분당 10) 안에서 여유롭고, GitHub Actions(public repo)는 무제한이라 비용 0.
# 화면은 ISR(1분) 으로 뒤따라 갱신 → 점수 반영 지연 최대 약 6분.
# 비경기 시간엔 스크립트 활성 가드가 즉시 종료(매시 정각은 heartbeat 동기화)해
# Supabase write 부하를 줄인다 — 점수 신선도(활성 구간 5분 동기화)는 그대로.
on:
  workflow_dispatch: # cron-job.org에서 5분 간격으로 API 호출해 발화 (GitHub schedule throttle 우회)
    inputs:
      force:
        description: "활성-구간 가드를 무시하고 전체 경기를 강제 재동기화 (점수 로직 변경 후 백필용)"
        type: boolean
        default: false

# 직전 실행이 안 끝났으면 새 실행을 큐에 쌓지 않고 건너뜀(중복 방지)
concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6 # 버전은 package.json packageManager(pnpm@10.x) 에서 자동 감지

      - uses: actions/setup-node@v6
        with:
          node-version: "24" # 네이티브 TypeScript 타입 스트리핑(.ts import) 지원
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: sync matches
        run: node scripts/sync-matches.mjs
        env:
          # cron-job.org의 5분 주기 발화는 inputs를 안 넘겨 force=false(=0) → 활성-구간 가드 유지.
          # 수동 실행에서 force=true 일 때만 SYNC_FORCE=1 로 전체 강제 재동기화.
          SYNC_FORCE: ${{ inputs.force && '1' || '0' }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
